services:
  postgres-dev:
    image: postgres:18
    networks:
      - tr-devnet
    environment:
      POSTGRES_DB: transcendence
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pass
    volumes:
      - dev-db-data:/var/lib/postgres
    secrets:
      - postgres_pass
    restart: unless-stopped
  backend-dev:
    build:
      context: backend
      dockerfile: Dockerfile-dev
    depends_on:
      - postgres-dev
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=debug
    networks:
      - tr-devnet
    volumes:
      - ./backend:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    restart: unless-stopped

networks:
  tr-devnet:
    driver: bridge

volumes:
  cargo-cache:
  target-cache:
  dev-db-data:

secrets:
  postgres_pass:
    file: secrets/postgres_pass.txt
