# TODO: REFINE DOCKER COMPOSE!!!

services:
  postgres:
    image: postgres:18
    networks:
      - tr-devnet
    environment:
      POSTGRES_DB: transcendence
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pass
    volumes:
      - dev-db-data:/var/lib/postgresql
    secrets:
      - postgres_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: backend
      dockerfile: Dockerfile-dev
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      RUST_LOG: debug
      DB_HOST: postgres
      DB_USER: transcendence
      DB_NAME: transcendence
      DB_PASSWORD_FILE: /run/secrets/postgres_pass
      REDIS_URL: redis://redis:6379
    networks:
      - tr-devnet
    secrets:
      - postgres_pass
    volumes:
      - ./backend:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    restart: unless-stopped
  frontend:
    build:
      context: frontend
      dockerfile: Dockerfile-dev
    networks:
      - tr-devnet
    volumes:
      - ./frontend:/app
      - node-cache:/app/node_modules
    restart: unless-stopped
  redis:
    image: redis:8-alpine
    networks:
      - tr-devnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped
  nginx:
    image: nginx
    depends_on:
      - backend
      - frontend
    ports:
      - 8080:8080
    volumes:
      - ./nginx-conf.d:/etc/nginx/conf.d:ro
    secrets:
      - ssl_cert
      - ssl_key
    networks:
      - tr-devnet
    restart: unless-stopped

networks:
  tr-devnet:
    driver: bridge

volumes:
  cargo-cache:
  target-cache:
  node-cache:
  dev-db-data:

secrets:
  postgres_pass:
    file: ./secrets/postgres_pass.txt
  ssl_cert:
    file: ./secrets/ssl_cert.pem
  ssl_key:
    file: ./secrets/ssl_key.pem
