
services:
  postgres-dev:
    image: postgres:18
    ports:
      - "5432:5432"
    networks:
      - tr-devnet
    environment:
      POSTGRES_DB: transcendence
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pass
    volumes:
      - dev-db-data:/var/lib/postgresql
    secrets:
      - postgres_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence"]
      interval: 2s
      timeout: 3s
      retries: 20
      start_period: 5s
    restart: unless-stopped

  backend-dev:
    build:
      context: backend
      dockerfile: Dockerfile-dev
    depends_on:
      postgres-dev:
        condition: service_healthy
      redis-dev:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: debug
      DB_HOST: postgres-dev
      DB_USER: transcendence
      DB_NAME: transcendence
      DB_PASSWORD_FILE: /run/secrets/postgres_pass
      REDIS_URL: redis://redis-dev:6379
    networks:
      - tr-devnet
    secrets:
      - postgres_pass
    volumes:
      - ./backend:/app
      - cargo-cache:/usr/local/cargo/registry
      - target-cache:/app/target
    restart: unless-stopped
  frontend-dev:
    build:
      context: frontend
      dockerfile: Dockerfile-dev
    ports:
      - "5173:5173"
    networks:
      - tr-devnet
    volumes:
      - ./frontend:/app
      - node-cache:/app/node_modules
    restart: unless-stopped
  redis-dev:
    image: redis:8-alpine
    networks:
      - tr-devnet
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 15
    restart: unless-stopped

networks:
  tr-devnet:
    driver: bridge

volumes:
  cargo-cache:
  target-cache:
  node-cache:
  dev-db-data:

secrets:
  postgres_pass:
    file: ./secrets/postgres_pass.txt
