server {
    listen 8080 ssl;

    include /etc/nginx/conf.d/snippets/ssl.conf;

    location / {
        include /etc/nginx/conf.d/snippets/proxy.conf;
        proxy_pass http://frontend:5173;
    }

    location /api/ {
        include /etc/nginx/conf.d/snippets/proxy.conf;
        proxy_pass http://backend:8080;
    }
}
