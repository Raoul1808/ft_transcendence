[package]
name = "tr-back"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = { version = "0.8.9", features = ["ws"] }
bytes = "1.12.1"
dotenvy = "0.15.7"
futures-util = "0.3.34"
tokio = { version = "1.53.3", features = ["full"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tower-http = { version = "0.7.1", features = ["trace", "cors", "fs"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
sqlx = { version = "0.9.0", features = ["postgres", "runtime-tokio", "macros", "migrate"] }
