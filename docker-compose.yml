
services:
  postgres:
    image: postgres:18
    networks:
      - tr-net
    environment:
      POSTGRES_DB: transcendence
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pass
    volumes:
      - db-data:/var/lib/postgresql
    secrets:
      - postgres_pass
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U transcendence -d transcendence"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    restart: unless-stopped

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      RUST_LOG: info
      DB_HOST: postgres
      DB_USER: transcendence
      DB_NAME: transcendence
      DB_PASSWORD_FILE: /run/secrets/postgres_pass
    networks:
      - tr-net
    secrets:
      - postgres_pass
    restart: unless-stopped

networks:
  tr-net:
    driver: bridge

volumes:
  db-data:

secrets:
  postgres_pass:
    file: ./secrets/postgres_pass.txt
