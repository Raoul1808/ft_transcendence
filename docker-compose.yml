services:
  postgres:
    image: postgres:18
    networks:
      - tr-net
    environment:
      POSTGRES_DB: transcendence
      POSTGRES_USER: transcendence
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_pass
    volumes:
      - db-data:/var/lib/postgres
    secrets:
      - postgres_pass
    restart: unless-stopped
  backend:
    build: backend
    depends_on:
      - postgres
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    networks:
      - tr-net
    restart: unless-stopped

networks:
  tr-net:
    driver: bridge

volumes:
  db-data:

secrets:
  postgres_pass:
    file: secrets/postgres_pass.txt
