services:
  backend:
    build: backend
    ports:
      - "8080:8080"
    environment:
      - RUST_LOG=info
    networks:
      - tr-net
    restart: unless-stopped
  frontend:
    build: frontend
    ports:
      - "5173:5173"
    networks:
      - tr-net
    restart: unless-stopped

networks:
  tr-net:
    driver: bridge
